<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#064e3b"/>
  <!-- Tree trunk -->
  <rect x="29" y="38" width="6" height="16" rx="2" fill="#10b981"/>
  <!-- Tree canopy circles representing lineage nodes -->
  <circle cx="32" cy="20" r="8" fill="#10b981"/>
  <circle cx="20" cy="30" r="6" fill="#059669"/>
  <circle cx="44" cy="30" r="6" fill="#059669"/>
  <circle cx="14" cy="42" r="4" fill="#f59e0b"/>
  <circle cx="50" cy="42" r="4" fill="#f59e0b"/>
  <!-- Connecting branches -->
  <line x1="32" y1="22" x2="20" y2="30" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="22" x2="44" y2="30" stroke="#10b981" stroke-width="2" opacity="0.6"/>
  <line x1="20" y1="32" x2="14" y2="42" stroke="#059669" stroke-width="2" opacity="0.6"/>
  <line x1="44" y1="32" x2="50" y2="42" stroke="#059669" stroke-width="2" opacity="0.6"/>
</svg>
