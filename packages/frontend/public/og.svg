<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Mekar — Spotify-style royalty for AI agents on 0G">
  <defs>
    <!-- Cream background with a subtle gold halo on the upper right -->
    <radialGradient id="warm" cx="0.78" cy="0.22" r="0.78">
      <stop offset="0%" stop-color="#f6e4ad" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fbf6ec" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f3ead7" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a437"/>
      <stop offset="100%" stop-color="#b9882c"/>
    </linearGradient>
    <filter id="paper" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.86  0 0 0 0 0.78  0 0 0 0 0.62  0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Cream paper background -->
  <rect width="1200" height="630" fill="url(#warm)"/>
  <rect width="1200" height="630" fill="#fbf6ec" filter="url(#paper)" opacity="0.6"/>

  <!-- Subtle decorative grid lines (woodcut typographic frame feel) -->
  <g stroke="#3d2817" stroke-width="0.6" opacity="0.06">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
    <line x1="80"   y1="0" x2="80"   y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
  </g>

  <!-- ───────── Left column: brand + headline ───────── -->
  <g transform="translate(80, 100)">
    <!-- Bloom logo (4-petal woodcut, gold + cocoa) -->
    <g transform="translate(0, 0)">
      <g stroke="#3d2817" stroke-width="1.6" fill="#d4a437" stroke-linejoin="round">
        <path d="M 28 0 C 18 -8, 18 -22, 28 -38 C 38 -22, 38 -8, 28 0 Z"/>
        <path d="M 28 0 C 38 -8, 52 -8, 66 0 C 52 8, 38 8, 28 0 Z"/>
        <path d="M 28 0 C 38 8, 38 22, 28 38 C 18 22, 18 8, 28 0 Z"/>
        <path d="M 28 0 C 18 8, 4 8, -10 0 C 4 -8, 18 -8, 28 0 Z"/>
      </g>
      <circle cx="28" cy="0" r="5" fill="#3d2817"/>
    </g>
    <!-- Wordmark -->
    <text x="86" y="10" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="44" font-weight="500" fill="#3d2817">Mekar</text>
    <text x="86" y="38" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" letter-spacing="3" fill="#5a3f2a" opacity="0.7">A I  ·  G E N E A L O G Y  ·  R O Y A L T Y</text>

    <!-- Headline -->
    <text x="0" y="160" font-family="Georgia, 'Cormorant Garamond', serif" font-size="72" font-weight="500" fill="#3d2817">Every AI has</text>
    <text x="0" y="234" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="72" font-weight="500" fill="#3d2817">a lineage.</text>

    <text x="0" y="304" font-family="Georgia, 'Cormorant Garamond', serif" font-size="40" font-weight="400" fill="#5a3f2a">Every inference pays</text>
    <text x="0" y="350" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="40" font-weight="400" fill="#5a3f2a">its ancestors.</text>

    <!-- Pill: live on 0G Galileo -->
    <g transform="translate(0, 400)">
      <rect x="0" y="0" width="320" height="40" rx="20" fill="#fbf6ec" stroke="#3d2817" stroke-width="1.4"/>
      <circle cx="22" cy="20" r="6" fill="#6b8a4b"/>
      <text x="40" y="26" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="12" letter-spacing="2" fill="#3d2817" font-weight="600">LIVE · 0G GALILEO · TRACK 3</text>
    </g>
  </g>

  <!-- ───────── Right column: lineage tree (3 blooms + cascade arrows) ───────── -->
  <g transform="translate(820, 90)">
    <!-- connector lines (woodcut: shadow under, main on top, sage pod midpoint) -->
    <g stroke="#3d2817" stroke-linecap="round">
      <!-- Genesis → Fork -->
      <line x1="140" y1="100" x2="60"  y2="240" stroke-width="6" opacity="0.10"/>
      <line x1="140" y1="100" x2="60"  y2="240" stroke-width="1.8"/>
      <!-- Genesis → Fork -->
      <line x1="140" y1="100" x2="220" y2="240" stroke-width="6" opacity="0.10"/>
      <line x1="140" y1="100" x2="220" y2="240" stroke-width="1.8"/>
      <!-- both → Compose -->
      <line x1="60"  y1="280" x2="140" y2="400" stroke-width="6" opacity="0.10"/>
      <line x1="60"  y1="280" x2="140" y2="400" stroke-width="1.8"/>
      <line x1="220" y1="280" x2="140" y2="400" stroke-width="6" opacity="0.10"/>
      <line x1="220" y1="280" x2="140" y2="400" stroke-width="1.8"/>
    </g>
    <!-- sage pod markers on each edge midpoint -->
    <g fill="#6b8a4b" stroke="#3d2817" stroke-width="0.9">
      <ellipse cx="100" cy="170" rx="4.5" ry="2.2"/>
      <ellipse cx="180" cy="170" rx="4.5" ry="2.2"/>
      <ellipse cx="100" cy="340" rx="4.5" ry="2.2"/>
      <ellipse cx="180" cy="340" rx="4.5" ry="2.2"/>
    </g>

    <!-- Genesis bloom (top, gold lotus) -->
    <g transform="translate(140, 80)">
      <g stroke="#3d2817" stroke-width="1.6" fill="#d4a437" stroke-linejoin="round">
        <g transform="rotate(0)"><path d="M 0 0 C -10 -14, -4 -38, 0 -54 C 4 -38, 10 -14, 0 0 Z"/></g>
        <g transform="rotate(60)"><path d="M 0 0 C -10 -14, -4 -38, 0 -54 C 4 -38, 10 -14, 0 0 Z"/></g>
        <g transform="rotate(120)"><path d="M 0 0 C -10 -14, -4 -38, 0 -54 C 4 -38, 10 -14, 0 0 Z"/></g>
        <g transform="rotate(180)"><path d="M 0 0 C -10 -14, -4 -38, 0 -54 C 4 -38, 10 -14, 0 0 Z"/></g>
        <g transform="rotate(240)"><path d="M 0 0 C -10 -14, -4 -38, 0 -54 C 4 -38, 10 -14, 0 0 Z"/></g>
        <g transform="rotate(300)"><path d="M 0 0 C -10 -14, -4 -38, 0 -54 C 4 -38, 10 -14, 0 0 Z"/></g>
      </g>
      <circle r="9" fill="#3d2817"/>
      <!-- label -->
      <rect x="-44" y="58" width="88" height="22" rx="3" fill="#fbf6ec" stroke="#3d2817" stroke-width="1"/>
      <text x="0" y="74" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" fill="#3d2817">Genesis #1</text>
    </g>

    <!-- Fork left (pink jasmine) -->
    <g transform="translate(60, 260)">
      <g stroke="#3d2817" stroke-width="1.4" fill="#f5b7a0" stroke-linejoin="round">
        <g transform="rotate(0)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
        <g transform="rotate(60)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
        <g transform="rotate(120)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
        <g transform="rotate(180)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
        <g transform="rotate(240)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
        <g transform="rotate(300)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
      </g>
      <circle r="6" fill="#3d2817"/>
      <rect x="-40" y="44" width="80" height="20" rx="3" fill="#fbf6ec" stroke="#3d2817" stroke-width="1"/>
      <text x="0" y="58" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" fill="#3d2817">Fork #2</text>
    </g>

    <!-- Fork right (pink jasmine) -->
    <g transform="translate(220, 260)">
      <g stroke="#3d2817" stroke-width="1.4" fill="#f5b7a0" stroke-linejoin="round">
        <g transform="rotate(0)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
        <g transform="rotate(60)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
        <g transform="rotate(120)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
        <g transform="rotate(180)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
        <g transform="rotate(240)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
        <g transform="rotate(300)"><path d="M 0 0 C -7 -10, -2 -28, 0 -38 C 2 -28, 7 -10, 0 0 Z"/></g>
      </g>
      <circle r="6" fill="#3d2817"/>
      <rect x="-40" y="44" width="80" height="20" rx="3" fill="#fbf6ec" stroke="#3d2817" stroke-width="1"/>
      <text x="0" y="58" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" fill="#3d2817">Fork #3</text>
    </g>

    <!-- Compose (bottom, marigold gold+coral) -->
    <g transform="translate(140, 420)">
      <g stroke="#3d2817" stroke-width="1.6" fill="#c25a4a" stroke-linejoin="round">
        <g transform="rotate(15)"><path d="M 0 0 C -9 -12, -3 -32, 0 -44 C 3 -32, 9 -12, 0 0 Z"/></g>
        <g transform="rotate(75)"><path d="M 0 0 C -9 -12, -3 -32, 0 -44 C 3 -32, 9 -12, 0 0 Z"/></g>
        <g transform="rotate(135)"><path d="M 0 0 C -9 -12, -3 -32, 0 -44 C 3 -32, 9 -12, 0 0 Z"/></g>
        <g transform="rotate(195)"><path d="M 0 0 C -9 -12, -3 -32, 0 -44 C 3 -32, 9 -12, 0 0 Z"/></g>
        <g transform="rotate(255)"><path d="M 0 0 C -9 -12, -3 -32, 0 -44 C 3 -32, 9 -12, 0 0 Z"/></g>
        <g transform="rotate(315)"><path d="M 0 0 C -9 -12, -3 -32, 0 -44 C 3 -32, 9 -12, 0 0 Z"/></g>
      </g>
      <g stroke="#3d2817" stroke-width="1.4" fill="#d4a437" stroke-linejoin="round">
        <g transform="rotate(0)"><path d="M 0 0 C -6 -8, -2 -22, 0 -30 C 2 -22, 6 -8, 0 0 Z"/></g>
        <g transform="rotate(60)"><path d="M 0 0 C -6 -8, -2 -22, 0 -30 C 2 -22, 6 -8, 0 0 Z"/></g>
        <g transform="rotate(120)"><path d="M 0 0 C -6 -8, -2 -22, 0 -30 C 2 -22, 6 -8, 0 0 Z"/></g>
        <g transform="rotate(180)"><path d="M 0 0 C -6 -8, -2 -22, 0 -30 C 2 -22, 6 -8, 0 0 Z"/></g>
        <g transform="rotate(240)"><path d="M 0 0 C -6 -8, -2 -22, 0 -30 C 2 -22, 6 -8, 0 0 Z"/></g>
        <g transform="rotate(300)"><path d="M 0 0 C -6 -8, -2 -22, 0 -30 C 2 -22, 6 -8, 0 0 Z"/></g>
      </g>
      <circle r="8" fill="#3d2817"/>
      <rect x="-50" y="46" width="100" height="22" rx="3" fill="#fbf6ec" stroke="#3d2817" stroke-width="1"/>
      <text x="0" y="62" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="10" fill="#3d2817">Compose #4</text>
    </g>
  </g>

  <!-- ───────── Footer bar ───────── -->
  <g transform="translate(80, 565)">
    <text x="0" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" fill="#5a3f2a">mekar.vercel.app</text>
    <text x="200" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" fill="#5a3f2a" opacity="0.5">·</text>
    <text x="220" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" fill="#5a3f2a">5 contracts</text>
    <text x="340" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" fill="#5a3f2a" opacity="0.5">·</text>
    <text x="360" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" fill="#5a3f2a">33 tests</text>
    <text x="450" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" fill="#5a3f2a" opacity="0.5">·</text>
    <text x="470" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="13" fill="#5a3f2a">push-based royalty cascade</text>
  </g>
  <g transform="translate(80, 593)">
    <text x="0" y="14" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#5a3f2a" opacity="0.7">#0GHACKATHON  ·  #BUILDON0G</text>
  </g>

  <!-- Right edge: 0G credit -->
  <g transform="translate(1120, 593)">
    <text x="0" y="14" text-anchor="end" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#5a3f2a" opacity="0.7">B U I L T   O N   0 G   /   E R C - 7 8 5 7</text>
  </g>
</svg>
