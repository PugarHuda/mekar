[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache_forge"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["AgentINFT", "MekarRegistry", "RoyaltyVault", "TrainingDataRegistry"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536
seed = "0x1"

[profile.ci]
fuzz = { runs = 10000 }
verbosity = 4

[rpc_endpoints]
zg_galileo = "https://evmrpc-testnet.0g.ai"
zg_mainnet = "https://evmrpc.0g.ai"
localhost = "http://127.0.0.1:8545"

[etherscan]
zg_galileo = { key = "no-api-key-needed", url = "https://chainscan-galileo.0g.ai/api", chain = 16602 }
zg_mainnet = { key = "no-api-key-needed", url = "https://chainscan.0g.ai/api", chain = 16661 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
